  });
}
function sha(str){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(str)).then(function(d){return Array.from(new Uint8Array(d)).map(function(x){return("0"+x.toString(16)).slice(-2)}).join("")})}
function acctKeys(name,pin){
  var nm=name.replace(/\s+/g," ").trim().slice(0,24),l=nm.toLowerCase();
  return Promise.all([sha("id:"+l+":"+pin),sha("nm:"+l)]).then(function(r){return{id:r[0].slice(0,20),nk:r[1].slice(0,20),name:nm}});
}
function aUrl(nk){return DB_URL.replace(/\/+$/,"")+"/accounts/"+ROOM+"/"+nk+".json"}
function getJ(u){return fetch(u).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})}
function putJ(u,v){return fetch(u,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(v)}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})}
function doCreate(name,pin){
  return acctKeys(name,pin).then(function(k){
    return getJ(aUrl(k.nk)).then(function(ex){
      if(ex)throw new Error("taken");
      return putJ(aUrl(k.nk),{id:k.id}).then(function(){
        S.acct={name:k.name,id:k.id};S.me.i=k.id;S.me.n=k.name;S.me.u=Date.now();S.f={};S.h={};save(false);
        return putJ(dbUrl(k.id),{n:S.me.n,d:myArr(),u:S.me.u});
      });
    });
  });
}
function doLogin(name,pin){
  return acctKeys(name,pin).then(function(k){
    return getJ(aUrl(k.nk)).then(function(ex){
      if(!ex||ex.id!==k.id)throw new Error("bad");
      return getJ(dbUrl(k.id)).then(function(rec){
        var r=rec||{};
        S.acct={name:k.name,id:k.id};
        S.me={i:k.id,n:cn(r.n)||k.name,d:toMap(r.d),u:Number(r.u)||Date.now()};
        S.f={};S.h={};save(false);
      });
    });
  });
}
function renderFriends(){
  if(!DB_URL)return renderFriendsCodes();
  var el=$("app");el.textContent="";
  var c0=valid(myArr()).length;
  $("stat").textContent=c0+" di "+total+" titoli visti";
  $("fill").style.width=(100*c0/total)+"%";
  var b=h("section","box");
  if(S.acct){
    b.appendChild(h("p","k","Account: "+S.acct.name));
    var sy=h("p","m");sy.id="sy";b.appendChild(sy);
    var ex=h("button",null,"Esci");ex.type="button";var arm=false;
    ex.addEventListener("click",function(){
      if(!arm){arm=true;ex.textContent="Tocca ancora per uscire";setTimeout(function(){arm=false;ex.textContent="Esci"},4000);return}
      S.acct=null;S.me={i:rid(),n:"",d:{},u:0};S.f={};S.h={};save(false);msg("Sei uscito. Con nome e PIN rientri quando vuoi.");renderFriends();
    });
    b.appendChild(ex);
    el.appendChild(b);
    var fl=h("div");fl.id="fl";el.appendChild(fl);setSync();drawList();pull();
    return;
  }
  b.appendChild(h("p","k","Il tuo account"));
  b.appendChild(h("p","m","Scegli un nome e un PIN di 4–8 cifre. Con lo stesso nome e PIN entri da qualsiasi telefono e ritrovi i tuoi progressi. Il PIN protegge poco: non usarne uno che usi altrove."));
  var ni=h("input");ni.type="text";ni.maxLength=24;ni.placeholder="Nome";ni.setAttribute("aria-label","Nome");ni.autocomplete="off";
  var pi=h("input");pi.type="password";pi.maxLength=8;pi.placeholder="PIN (4–8 cifre)";pi.setAttribute("aria-label","PIN");pi.setAttribute("inputmode","numeric");pi.autocomplete="off";
  b.appendChild(ni);b.appendChild(pi);
  var row=h("div","row"),bc=h("button",null,"Crea account"),bl=h("button",null,"Accedi");bc.type="button";bl.type="button";
  row.appendChild(bc);row.appendChild(bl);b.appendChild(row);el.appendChild(b);
  function go(fn,okMsg){
    var nm=ni.value.replace(/\s+/g," ").trim(),pin=pi.value.trim();
    if(!nm){msg("Scrivi un nome.");return}
    if(!/^\d{4,8}$/.test(pin)){msg("Il PIN deve avere da 4 a 8 cifre.");return}
    bc.disabled=bl.disabled=true;msg("Un attimo…");
    fn(nm,pin).then(function(){render();msg(okMsg);pull()}).catch(function(e){
      bc.disabled=bl.disabled=false;
      var m=e&&e.message;
      msg(m==="taken"?"Questo nome è già in uso. Se è tuo, tocca Accedi.":m==="bad"?"Nome o PIN non corretti.":"Connessione non riuscita ("+(m||"errore")+"). Riprova.");
    });
  }
  bc.addEventListener("click",function(){go(doCreate,"Account creato. I tuoi progressi ora sono condivisi.")});
  bl.addEventListener("click",function(){go(doLogin,"Bentornato! Progressi ripristinati.")});
}
function renderFriendsCodes(){
  var el=$("app");el.textContent="";
  var c0=valid(myArr()).length;
  $("stat").textContent=c0+" di "+total+" titoli visti";
  $("fill").style.width=(100*c0/total)+"%";
  var fl=h("div");fl.id="fl";
  var b1=h("section","box"),mc=null;
  b1.appendChild(h("p","k","Il tuo nickname"));
  var ni=h("input");ni.type="text";ni.maxLength=24;ni.placeholder="Come ti vedranno gli amici";ni.value=S.me.n;ni.setAttribute("aria-label","Nickname");
  function setNick(){S.me.n=cn(ni.value);save();push();if(mc)mc.value=myCode();drawList()}
  ni.addEventListener("input",setNick);ni.addEventListener("change",setNick);
  b1.appendChild(ni);
  var sy=h("p","m");sy.id="sy";b1.appendChild(sy);
  if(!DB_URL){
    mc=field(b1,"Il tuo codice",true,myCode(),3);
    var bc=h("button",null,"Copia il mio codice");bc.type="button";
    bc.addEventListener("click",function(){setNick();copy(mc.value,mc).then(function(ok){msg(ok?"Codice copiato. Mandalo agli amici.":"Tieni premuto sul codice, seleziona tutto e copia.")})});
    b1.appendChild(bc);
    b1.appendChild(h("p","m","Il codice cambia ogni volta che spunti un titolo: rimandalo agli amici quando vuoi aggiornarli."));
  }
  el.appendChild(b1);setSync();
  if(DB_URL)el.appendChild(fl);
  if(!DB_URL){
    var b2=h("section","box");
    var inp=field(b2,"Aggiungi un amico",false,"",3);inp.placeholder="Incolla qui il codice dell’amico";
    var ba=h("button",null,"Aggiungi");ba.type="button";
    ba.addEventListener("click",function(){var t=inp.value;if(!t.trim()){msg("Incolla prima un codice.");return}var r=importCode(t);renderFriends();msg(r)});
    b2.appendChild(ba);
    b2.appendChild(h("p","m","Lo stesso campo serve per ripristinare un backup."));
    el.appendChild(b2);
  }
  var b3=h("section","box");
  var bk=field(b3,"Backup completo",true,backupCode(),3);
  var bb=h("button",null,"Copia il backup");bb.type="button";
  bb.addEventListener("click",function(){copy(bk.value,bk).then(function(ok){msg(ok?"Backup copiato. Salvalo nelle note o in una chat.":"Tieni premuto sul backup, seleziona tutto e copia.")})});
  b3.appendChild(bb);
  b3.appendChild(h("p","m","Se Safari cancella i dati, incolla il backup"+(DB_URL?" qui sotto":" nel campo qui sopra")+" e ritrovi i tuoi progressi."));
  if(DB_URL){var ib=field(b3,"Ripristina da backup",false,"",2);ib.placeholder="Incolla qui il backup";var br=h("button",null,"Ripristina");br.type="button";br.addEventListener("click",function(){if(!ib.value.trim()){msg("Incolla prima il backup.");return}var r=importCode(ib.value);renderFriends();msg(r)});b3.appendChild(br)}
  el.appendChild(b3);
  if(!DB_URL)el.appendChild(fl);
  drawList();
}
function render(){
  $("tIo").setAttribute("aria-pressed",tab==="io");
  $("tAm").setAttribute("aria-pressed",tab==="am");
  if(tab==="io")renderMine();else renderFriends();
}
$("app").addEventListener("change",function(e){
  var id=e.target.getAttribute("data-i");if(id===null)return;
  if(e.target.checked)S.me.d[id]=1;else delete S.me.d[id];
  save();push();render();
  var el=document.querySelector('input[data-i="'+id+'"]');if(el)el.focus({preventScroll:true});
});
$("tIo").addEventListener("click",function(){tab="io";msg("");render()});
$("tAm").addEventListener("click",function(){tab="am";msg("");render()});
var rb=$("reset"),armed=false;
rb.addEventListener("click",function(){
  if(!armed){armed=true;rb.textContent="Tocca ancora per azzerare";setTimeout(function(){armed=false;rb.textContent="Azzera i miei progressi"},4000);return}
  S.me.d={};save();push();render();armed=false;rb.textContent="Azzera i miei progressi";
});
render();
if(DB_URL){if(!S.acct)msg("Crea un account nella scheda Amici per condividere i progressi con gli amici.");else{push();pull()}setInterval(pull,5000)}
</script>
