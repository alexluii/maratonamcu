<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pannello admin</title>
<style>
:root{
  --bg:#eef1f6;--card:#fff;--ink:#101828;--mute:#5b6577;--line:#dde2ec;
  --brand:#1d2a5c;--brand-ink:#fff;--go:#ffb627;--go-ink:#101828;--bad:#c9283d;--ok:#1b8a52;--soft:#f5f7fb;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0c1020;--card:#151b34;--ink:#eef1fb;--mute:#9aa5c0;--line:#27305a;
  --brand:#2c3b86;--brand-ink:#fff;--soft:#1b2342;--bad:#ff6b7d;--ok:#47c98a;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--brand);color:var(--brand-ink)}
.top h1{margin:0;font-size:18px;flex:1}
.top button{padding:8px 12px;border:1px solid rgba(255,255,255,.35);border-radius:10px;background:transparent;color:inherit;font-weight:600;font-size:14px}
main{max-width:720px;margin:0 auto;padding:16px}
h2{margin:22px 0 10px;font-size:15px;color:var(--mute);font-weight:700}
h2:first-child{margin-top:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 10px}
.card p{margin:0 0 6px}
.m{color:var(--mute);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{min-height:44px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--soft);font-weight:600}
.btn.pri{background:var(--go);border-color:var(--go);color:var(--go-ink)}
.btn.bad{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
a.btn{display:inline-block;color:inherit;text-decoration:none}
.btn:disabled{opacity:.5;cursor:default}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.stat b{display:block;font-size:30px;line-height:1.1}
.stat span{font-size:13px;color:var(--mute)}
.todo{display:flex;align-items:center;gap:12px;width:100%;padding:14px;margin:0 0 10px;border:1px solid var(--line);border-radius:16px;background:var(--card);text-align:left}
.todo .n{flex:none;min-width:38px;height:38px;border-radius:19px;display:grid;place-items:center;background:var(--bad);color:#fff;font-weight:800}
.todo strong{display:block}
.ok{padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--ok);font-weight:700}
input[type=text],input[type=search],select,textarea{width:100%;min-height:44px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card)}
.person,.squad{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin:0 0 8px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:left}
.person.flat{margin:0;padding:0;border:0;background:none}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:#fff;font-weight:800}
.person .t,.squad .t{flex:1;min-width:0}
.person .t b,.squad .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--go)}
.chev{flex:none;color:var(--mute)}
.back{margin:0 0 12px;padding:8px 12px;border:0;background:none;color:var(--mute);font-weight:700}
.mem{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.mem:first-of-type{border-top:0}
.chatlog{max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px 0}
.msg{align-self:flex-start;max-width:90%;padding:8px 12px;border-radius:12px;background:var(--soft);border:1px solid var(--line);overflow-wrap:anywhere}
.msg b{display:block;font-size:12px;color:var(--mute)}
.msg button{margin-left:8px;border:0;border-radius:8px;background:var(--line);padding:0 8px}
.day{align-self:center;font-size:12px;font-weight:700;color:var(--mute)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;border:0;background:none;color:var(--mute);font-size:12px;font-weight:700}
.tabs button[aria-current=page]{color:var(--ink)}
.tabs button[aria-current=page]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--go)}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs .dot{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:40;margin:0 auto;max-width:520px;padding:12px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.login{max-width:380px;margin:12vh auto 0;padding:16px}
.login h1{margin:0 0 4px;font-size:24px}
.login input{margin:0 0 10px}
.lg{padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.lg:first-child{border-top:0}
@media(min-width:1000px){
  body.in{padding-bottom:0;padding-left:230px}
  .top{padding:16px 32px}.top h1{font-size:22px}
  .tabs{top:0;right:auto;bottom:0;width:230px;flex-direction:column;justify-content:flex-start;gap:4px;padding:84px 12px 12px;border-top:0;border-right:1px solid var(--line)}
  .tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;border-radius:12px;font-size:15px}
  .tabs button[aria-current=page]{background:var(--soft)}
  .tabs button[aria-current=page]::before{left:0;right:auto;top:10px;bottom:10px;width:4px;height:auto;border-radius:0 4px 4px 0}
  .tabs .dot{position:static;margin-left:auto}
  body.in .top{margin-left:-230px;padding-left:262px}
  main{max-width:1060px;padding:28px 32px}
  .grid{grid-template-columns:repeat(4,1fr)}
  #main>.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;align-items:start}
  .toast{left:230px;bottom:24px}
}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <h1>Pannello admin</h1>
  <p class="m">Solo per chi gestisce la Maratona MCU.</p>
  <form id="lf">
    <input id="e" type="text" inputmode="email" autocomplete="username" placeholder="Email" aria-label="Email" required>
    <input id="p" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required style="width:100%;min-height:44px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card)">
    <button class="btn pri" id="lb" type="submit" style="width:100%">Entra</button>
  </form>
  <p id="lm" class="m" role="status"></p>
  <p><a href="./" class="m">Torna al sito</a></p>
</div>

<div id="app" hidden>
  <header class="top"><h1 id="ttl">Oggi</h1><button id="rf" type="button">Aggiorna</button><button id="out" type="button">Esci</button></header>
  <main id="main"></main>
  <nav class="tabs" id="tabs" aria-label="Sezioni"></nav>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
var KEY="AIzaSyCvYDHW-dleGjx9U0WT50PcayjGx2m3Iik",UID="lvhh3G1jVUfsmZDeGHoArysTVpr1";
var DB="https://maratona-579e6-default-rtdb.europe-west1.firebasedatabase.app",ROOM="amici-mcu";
var SK="mcu-adm",SES=null,byId={},total=0;
var ST={users:{},removed:{},groups:{},members:{},mutes:{},greq:{},reports:{},preq:{}};
var tab="oggi",view=null,query="";

function $(i){return document.getElementById(i)}
function h(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
var tt=null;function toast(m){var t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},3800)}
function sha(s){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(function(d){return Array.from(new Uint8Array(d)).map(function(x){return("0"+x.toString(16)).slice(-2)}).join("")})}
function when(t){return new Date(t).toLocaleString("it-IT",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
function ago(t){if(!t)return"mai";var d=Math.floor((Date.now()-t)/86400000);return d<1?"oggi":d===1?"ieri":d+" giorni fa"}

/* ---------- sessione e rete ---------- */
function loadSes(){try{var o=JSON.parse(localStorage.getItem(SK)||"null");if(o&&o.uid===UID&&o.r&&o.u>Date.now()){SES=o;return true}localStorage.removeItem(SK)}catch(e){}SES=null;return false}
function saveSes(){try{localStorage.setItem(SK,JSON.stringify(SES))}catch(e){}}
function token(){
  if(!SES)return Promise.resolve(null);
  if(SES.x-Date.now()>120000)return Promise.resolve(SES.t);
  return fetch("https://securetoken.googleapis.com/v1/token?key="+KEY,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(SES.r)})
   .then(function(r){return r.json()}).then(function(o){if(!o.id_token){return null}SES.t=o.id_token;SES.r=o.refresh_token;SES.x=Date.now()+Number(o.expires_in||3600)*1000;saveSes();return SES.t}).catch(function(){return null});
}
function url(p,q){return DB+"/"+p+".json"+(q||"")}
function authed(u){return token().then(function(t){return t?u+(u.indexOf("?")<0?"?":"&")+"auth="+encodeURIComponent(t):u})}
function ok(r){if(!r.ok)throw new Error("HTTP "+r.status);return r}
function GET(p,q){return fetch(url(p,q)).then(ok).then(function(r){return r.json()})}
function PUT(p,v){return authed(url(p)).then(function(u){return fetch(u,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(v)})}).then(ok).then(function(r){return r.json()})}
function DEL(p){return authed(url(p)).then(function(u){return fetch(u,{method:"DELETE"})}).then(ok)}
function LOG(t){authed(url("adminLog/"+ROOM)).then(function(u){return fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({t:Date.now(),a:String(t).slice(0,200)})})}).catch(function(){})}
function obj(x){return x&&typeof x==="object"?x:{}}

/* ---------- elenco titoli (preso da index.html) ---------- */
function loadTitles(){
  return fetch("./index.html").then(function(r){return r.text()}).then(function(t){
    var m=t.match(/var P=\[\n([\s\S]*?)\n\];/);if(!m)return;
    var arr=new Function("return ["+m[1]+"]")();
    arr.forEach(function(ph){ph[1].forEach(function(x){var u=(x[3]||"").indexOf("U")>=0&&x[4]&&new Date(x[4][0],x[4][1]-1,x[4][2]).getTime()>Date.now();byId[x[0]]={t:x[1],u:u};if(!u)total++})});
  }).catch(function(){});
}
function doneOf(u){return(Array.isArray(u.d)?u.d:[]).filter(function(i){return Number.isInteger(i)&&(!byId[i]||!byId[i].u)})}

/* ---------- dati ---------- */
function load(){
  var rd=function(p){return GET(p).catch(function(){return null})};
  return Promise.all([rd("rooms/"+ROOM),rd("removed/"+ROOM),rd("groups"),rd("groupMembers"),rd("mutes"),rd("groupRequests/"+ROOM),rd("reports/"+ROOM),rd("requests/"+ROOM)]).then(function(r){
    ST={users:obj(r[0]),removed:obj(r[1]),groups:obj(r[2]),members:obj(r[3]),mutes:obj(r[4]),greq:obj(r[5]),reports:obj(r[6]),preq:obj(r[7])};
  });
}
function nGreq(){return Object.keys(ST.greq).filter(function(k){return ST.greq[k]&&ST.greq[k].s==="p"})}
function nRep(){return Object.keys(ST.reports).filter(function(k){return ST.reports[k]})}
function nPin(){return Object.keys(ST.preq).filter(function(k){return ST.users[k]})}
function badge(){return nGreq().length+nRep().length+nPin().length}

/* ---------- componenti ---------- */
function two(b,label,fn){var arm=false;b.addEventListener("click",function(){if(!arm){arm=true;b.textContent="Tocca ancora";setTimeout(function(){arm=false;b.textContent=label},4000);return}arm=false;b.textContent=label;fn()})}
function btn(label,cls,fn){var b=h("button","btn "+(cls||""),label);b.type="button";if(fn)b.addEventListener("click",fn);return b}
function fail(e){toast(e&&e.message==="taken"?"Questo codice è già usato: scegline un altro.":e&&e.message==="full"?"La squadra è piena.":e&&e.message==="none"?"Non esiste più.":"Operazione non riuscita. Riprova.")}
function initials(n){return String(n||"?").trim().slice(0,1).toUpperCase()}
function chatArr(o){var a=[];Object.keys(obj(o)).sort().forEach(function(k){var x=o[k];if(x&&typeof x.m==="string")a.push({k:k,n:String(x.n||"?"),m:x.m.slice(0,300),t:Number(x.t)||0})});return a}
function chatView(gid,gname){
  var box=h("div","chatlog");box.appendChild(h("p","m","Caricamento…"));
  GET("chats/"+gid,'?orderBy="$key"&limitToLast=100').then(function(o){
    box.textContent="";var a=chatArr(o);if(!a.length){box.appendChild(h("p","m","Nessun messaggio."));return}
    var last="";
    a.forEach(function(x){
      var d=x.t?new Date(x.t).toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"}):"";if(d&&d!==last){last=d;box.appendChild(h("div","day",d))}
      var m=h("div","msg"),hd=h("b",null,x.n+(x.t?" · "+new Date(x.t).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}):""));
      m.appendChild(hd);m.appendChild(document.createTextNode(x.m));
      var xb=h("button",null,"×");xb.type="button";xb.setAttribute("aria-label","Cancella il messaggio");var arm=false;
      xb.addEventListener("click",function(){if(!arm){arm=true;xb.textContent="Cancella?";setTimeout(function(){arm=false;xb.textContent="×"},3500);return}
        DEL("chats/"+gid+"/"+x.k).then(function(){m.remove();LOG("Cancellato un messaggio di "+x.n+" in «"+gname+"»")}).catch(fail)});
      hd.appendChild(xb);box.appendChild(m);
    });
    box.scrollTop=box.scrollHeight;
  }).catch(function(){box.textContent="";box.appendChild(h("p","m","Non riesco a leggere la chat."))});
  return box;
}

/* ---------- azioni sulle squadre ---------- */
function gKeys(code){var gid;return sha("gc:"+code).then(function(x){gid=x.slice(0,20);return sha("gp:"+gid+":"+code)}).then(function(p){return{gid:gid,ph:p.slice(0,32)}})}
function approve(k){
  var q=ST.greq[k];if(!q)return Promise.reject(new Error("none"));
  return GET("groups/"+k).then(function(ex){if(ex)throw new Error("taken");
    return PUT("groups/"+k,{n:q.gn,ph:q.ph,o:q.by,a:q.an,max:q.p,t:Date.now()})})
   .then(function(){return PUT("groupMembers/"+k+"/"+q.by,{n:q.bn,r:"owner"})}).then(function(){return PUT("userGroups/"+q.by+"/"+k,q.gn)})
   .then(function(){return DEL("groupRequests/"+ROOM+"/"+k)}).then(function(){LOG("Approvata la squadra «"+q.gn+"»")});
}
function reject(k){var q=ST.greq[k];q.s="no";return PUT("groupRequests/"+ROOM+"/"+k,q).then(function(){LOG("Rifiutata la squadra «"+q.gn+"»")})}
function kick(gid,id){return Promise.all([DEL("groupMembers/"+gid+"/"+id),DEL("userGroups/"+id+"/"+gid)])}
function makeOwner(gid,id){
  var ms=obj(ST.members[gid]),g=ST.groups[gid],q=[];
  Object.keys(ms).forEach(function(k){if(ms[k].r==="owner"&&k!==id)q.push(PUT("groupMembers/"+gid+"/"+k,{n:ms[k].n,r:"member"}))});
  q.push(PUT("groupMembers/"+gid+"/"+id,{n:ms[id].n,r:"owner"}));g.o=id;q.push(PUT("groups/"+gid,g));return Promise.all(q);
}
function rename(gid,name){var g=ST.groups[gid],q=[];g.n=name;q.push(PUT("groups/"+gid,g));Object.keys(obj(ST.members[gid])).forEach(function(id){q.push(PUT("userGroups/"+id+"/"+gid,name))});return Promise.all(q)}
function changeCode(gid,code){
  var g=ST.groups[gid],ms=obj(ST.members[gid]);
  return gKeys(code).then(function(k){
    return Promise.all([GET("groups/"+k.gid),GET("chats/"+gid)]).then(function(r){
      if(r[0])throw new Error("taken");
      var ng=Object.assign({},g,{ph:k.ph}),q=[PUT("groups/"+k.gid,ng),PUT("groupMembers/"+k.gid,ms)];
      if(r[1])q.push(PUT("chats/"+k.gid,r[1]));
      Object.keys(ms).forEach(function(id){q.push(PUT("userGroups/"+id+"/"+k.gid,g.n))});
      return Promise.all(q).then(function(){var d=[DEL("groups/"+gid),DEL("groupMembers/"+gid),DEL("chats/"+gid),DEL("mutes/"+gid)];Object.keys(ms).forEach(function(id){d.push(DEL("userGroups/"+id+"/"+gid))});return Promise.all(d)}).then(function(){return k.gid});
    });
  });
}
function dropGroup(gid){var d=[DEL("groups/"+gid),DEL("groupMembers/"+gid),DEL("chats/"+gid),DEL("mutes/"+gid)];Object.keys(obj(ST.members[gid])).forEach(function(id){d.push(DEL("userGroups/"+id+"/"+gid))});return Promise.all(d)}
function movePerson(id,name,gid){
  var g=ST.groups[gid],ms=obj(ST.members[gid]);if(!g)return Promise.reject(new Error("none"));
  if(!ms[id]&&g.max&&Object.keys(ms).length>=g.max)return Promise.reject(new Error("full"));
  var role=ms[id]&&ms[id].r?ms[id].r:"member";
  return PUT("groupMembers/"+gid+"/"+id,{n:name,r:role}).then(function(){return PUT("userGroups/"+id+"/"+gid,g.n||"")});
}

/* ---------- schermate ---------- */
var main=$("main");
function show(){
  main.textContent="";
  if(view&&view.t==="squad")return squadPage(view.gid);
  ({oggi:pageOggi,rich:pageRich,pers:pagePers,squ:pageSqu,altro:pageAltro})[tab]();
}
function setTitle(t){$("ttl").textContent=t}
function tabsUi(){
  var T=[["oggi","Oggi","M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"],["rich","Richieste","M4 5h16v11H8l-4 4zM8 9h8M8 12h5"],["pers","Persone","M9 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM2.5 20c0-3.5 2.9-6 6.5-6s6.5 2.5 6.5 6M17 5.5a3 3 0 010 5.5M19 14.5c1.5.8 2.5 2.2 2.5 4.5"],["squ","Squadre","M12 3l8 4v5c0 4.5-3.3 7.7-8 9-4.7-1.3-8-4.5-8-9V7z"],["altro","Altro","M5 12h.01M12 12h.01M19 12h.01"]];
  var n=$("tabs");n.textContent="";var b=badge();
  T.forEach(function(x){
    var e=h("button");e.type="button";if(tab===x[0])e.setAttribute("aria-current","page");
    e.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+x[2]+'"/></svg>';e.appendChild(h("span",null,x[1]));
    if(x[0]==="rich"&&b){e.appendChild(h("span","dot",b))}
    e.addEventListener("click",function(){tab=x[0];view=null;query="";render()});n.appendChild(e);
  });
}
function render(){tabsUi();show();window.scrollTo(0,0)}

function pageOggi(){
  setTitle("Oggi");
  var g=nGreq().length,r=nRep().length,p=nPin().length;
  main.appendChild(h("h2",null,"Da fare"));
  function todo(n,l,sub,go){var b=h("button","todo");b.type="button";b.appendChild(h("span","n",n));var d=h("div");d.appendChild(h("strong",null,l));d.appendChild(h("span","m",sub));b.appendChild(d);b.addEventListener("click",function(){tab=go;view=null;render()});main.appendChild(b)}
  if(!g&&!r&&!p)main.appendChild(h("div","ok","Tutto a posto: nessuna richiesta o segnalazione."));
  if(r)todo(r,r===1?"Segnalazione da controllare":"Segnalazioni da controllare","Leggi la chat e decidi","rich");
  if(g)todo(g,g===1?"Richiesta di nuova squadra":"Richieste di nuove squadre","Approva o rifiuta","rich");
  if(p)todo(p,p===1?"Richiesta di nuovo PIN":"Richieste di nuovo PIN","Si reimposta dal sito, scheda Amici","rich");
  var ids=Object.keys(ST.users).filter(function(k){return !ST.removed[k]&&ST.users[k]&&ST.users[k].n});
  var act=ids.filter(function(k){return Date.now()-(Number(ST.users[k].u)||0)<7*86400000}).length;
  main.appendChild(h("h2",null,"In numeri"));
  var gr=h("div","grid");
  [[ids.length,"Iscritti"],[act,"Attivi negli ultimi 7 giorni"],[Object.keys(ST.groups).length,"Squadre"],[nRep().length,"Segnalazioni aperte"]].forEach(function(x){var s=h("div","stat");s.appendChild(h("b",null,x[0]));s.appendChild(h("span",null,x[1]));gr.appendChild(s)});

function planRestore(b){
  var rd=function(p){return GET(p).catch(function(){return null})};
  return Promise.all([rd("rooms/"+ROOM),rd("removed/"+ROOM),rd("groups"),rd("groupMembers"),rd("userGroups"),rd("sponsors/"+ROOM)]).then(function(c){
    var w=[],pl={persone:0,squadre:0,legami:0,altri:0};
    var cur=obj(c[0]);Object.keys(obj(b.progressi)).forEach(function(k){var x=b.progressi[k];if(!x||typeof x!=="object")return;var y=cur[k];if(!y||Number(x.u)>Number(y.u||0)){w.push(["rooms/"+ROOM+"/"+k,x]);pl.persone++}});
    function flat(bk,cu,base,counter){Object.keys(obj(bk)).forEach(function(k){if(bk[k]!=null&&!(k in obj(cu))){w.push([base+"/"+k,bk[k]]);pl[counter]++}})}
    flat(b.rimossi,c[1],"removed/"+ROOM,"altri");flat(b.gruppi,c[2],"groups","squadre");flat(b.sponsor,c[5],"sponsors/"+ROOM,"altri");
    function nested(bk,cu,base){Object.keys(obj(bk)).forEach(function(a){Object.keys(obj(bk[a])).forEach(function(k2){if(bk[a][k2]!=null&&!(k2 in obj(obj(cu)[a]))){w.push([base+"/"+a+"/"+k2,bk[a][k2]]);pl.legami++}})})}
    nested(b.membri,c[3],"groupMembers");nested(b.gruppiUtente,c[4],"userGroups");
    pl.writes=w;return pl;
  });
}
