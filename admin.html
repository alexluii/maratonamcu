<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Area riservata</title>
<style>
:root{--bg:#eceefa;--ink:#0b1030;--panel:#fff;--line:#d3d7ee;--amber:#ffb627}
@media(prefers-color-scheme:dark){:root{--bg:#0b1030;--ink:#eef0ff;--panel:#161c44;--line:#2a3270}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif}
main{width:min(360px,92vw);padding:22px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
h1{margin:0 0 4px;font-size:20px}p{margin:0 0 14px;font-size:14px;opacity:.75}
input{display:block;width:100%;box-sizing:border-box;margin:0 0 10px;padding:12px;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px}
button{padding:12px 16px;font:700 15px system-ui,sans-serif;border:0;border-radius:12px;background:var(--amber);color:#0b1030;cursor:pointer}
a{margin-left:12px;color:inherit;font-size:14px}#m{min-height:20px;margin:10px 0 0;font-size:14px}
</style>
</head>
<body>
<main>
<h1>Area riservata</h1>
<p>Solo per chi gestisce il sito Maratona MCU.</p>
<form id="f">
<input id="e" type="email" autocomplete="username" placeholder="Email" aria-label="Email" required>
<input id="p" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required>
<button id="b" type="submit">Entra</button><a href="./">Torna al sito</a>
</form>
<div id="m" role="status"></div>
</main>
<script>
var KEY="AIzaSyCvYDHW-dleGjx9U0WT50PcayjGx2m3Iik",UID="lvhh3G1jVUfsmZDeGHoArysTVpr1";
var f=document.getElementById("f"),m=document.getElementById("m"),b=document.getElementById("b");
f.addEventListener("submit",function(ev){
  ev.preventDefault();b.disabled=true;m.textContent="Un attimo…";
  fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+KEY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("e").value.trim(),password:document.getElementById("p").value,returnSecureToken:true})})
  .then(function(r){return r.json()}).then(function(o){
    if(!o.idToken)throw new Error(o.error&&o.error.message||"x");
    if(o.localId!==UID)throw new Error("NOTADMIN");
    var u=Date.now()+30*60*1000;
    localStorage.setItem("mcu-adm",JSON.stringify({t:o.idToken,r:o.refreshToken,x:Date.now()+Number(o.expiresIn||3600)*1000,uid:o.localId,u:u}));
    location.replace("./");
  }).catch(function(e){
    b.disabled=false;var t=String(e.message);
    m.textContent=/TOO_MANY/.test(t)?"Troppi tentativi: riprova tra qualche minuto.":t==="NOTADMIN"?"Questo utente non è l’amministratore.":/INVALID|EMAIL_NOT_FOUND|PASSWORD/.test(t)?"Email o password non corrette.":"Accesso non riuscito.";
  });
});
</script>
</body>
</html>
